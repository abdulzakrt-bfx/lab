apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: repeat
  name: repeat
spec:
  replicas: 10
  selector:
    matchLabels:
      app: repeat
  template:
    metadata:
      labels:
        app: repeat
    spec:
      containers:
      - image: httpd
        name: httpd
        resources: {}
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 1
